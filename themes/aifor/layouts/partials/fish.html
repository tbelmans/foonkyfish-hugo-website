{{- /* Iconen. "merk-vis": het visje (alleen in het logo). "faq-vis": plus. Al de rest: strakke pijl. */ -}}
{{- if eq . "merk-vis" -}}
<svg class="vis merk-vis" viewBox="0 0 32 20" aria-hidden="true" focusable="false"><path d="M1 10C5 2.5 16 1 23 8l8-6-2.2 8L31 18l-8-6C16 19 5 17.5 1 10z" fill="currentColor"/><circle cx="8" cy="8.6" r="1.6" class="vis-oog"/></svg>
{{- else if eq . "faq-vis" -}}
<svg class="plus" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/></svg>
{{- else -}}
<svg class="pijl" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12h17M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/></svg>
{{- end -}}
