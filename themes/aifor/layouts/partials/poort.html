{{- /* De patrijspoort: abstracte golfbanden in een ronde uitsnede. Context: dict "id" (uniek) en "label". */ -}}
{{- $id := .id | default "poort" -}}
<svg class="poort-beeld" viewBox="0 0 400 400" role="img" aria-label="{{ .label }}">
  <defs>
    <clipPath id="{{ $id }}-cirkel"><circle cx="200" cy="200" r="200"/></clipPath>
    <filter id="{{ $id }}-korrel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#{{ $id }}-cirkel)">
    <rect width="400" height="400" fill="#081f2a"/>
    <circle cx="282" cy="96" r="38" fill="#ff6a3d" opacity=".95"/>
    <g fill="none" stroke="#fff1dc" stroke-width="1.5" opacity=".55">
      <path d="M-20 70C60 40 130 40 200 70S340 100 420 70"/>
      <path d="M-20 92C60 62 130 62 200 92S340 122 420 92"/>
      <path d="M-20 114C60 84 130 84 200 114S340 144 420 114"/>
    </g>
    <path fill="#2bb3a3" d="M-20 150C60 110 130 110 200 150S340 190 420 150V176C340 216 270 216 200 176S60 136 -20 176Z"/>
    <path fill="#ffc23d" d="M-20 188C60 148 130 148 200 188S340 228 420 188V210C340 250 270 250 200 210S60 170 -20 210Z"/>
    <path fill="#ff6a3d" d="M-20 222C60 182 130 182 200 222S340 262 420 222V296C340 336 270 336 200 296S60 256 -20 296Z"/>
    <path fill="#0d2f3f" d="M-20 308C60 268 130 268 200 308S340 348 420 308V420H-20Z"/>
    <g fill="none" stroke="#fff1dc" stroke-width="1.5" opacity=".4">
      <path d="M-20 340C60 300 130 300 200 340S340 380 420 340"/>
      <path d="M-20 362C60 322 130 322 200 362S340 402 420 362"/>
    </g>
    <rect width="400" height="400" filter="url(#{{ $id }}-korrel)"/>
  </g>
</svg>
